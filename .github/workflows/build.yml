name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify bootstrap
        run: ./mvnw -B -ntp verify
      - name: Compile staged integration dependencies
        run: ./mvnw -B -ntp -Predis,kafka,security -DskipTests package
