name: cbs-local
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU22-ubuntu-22.04@sha256:db9a8fe3098b7e8bbde41106bdc7caee942e97124e5fdb71b872ca208de3092d
    # ARM64 emulation is a local experiment, not a Microsoft-supported SQL Server platform.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Explicitly accept the SQL Server Developer license before startup}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Supply an external bootstrap administrator password}
      CBS_APP_PASSWORD: ${CBS_APP_PASSWORD:?Supply a separate external application password}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./scripts/sqlserver:/cbs-bootstrap:ro
    mem_limit: 4g
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 5 -b -Q "SET NOCOUNT ON; SELECT 1" >/dev/null'
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 30
volumes:
  sqlserver-data:
