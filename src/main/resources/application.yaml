spring:
  application:
    name: concurrent-balance-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
      connection-init-sql: SET LOCK_TIMEOUT 1000
      data-source-properties:
        loginTimeout: 5
        socketTimeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Schema changes run separately with db-migrate and dedicated credentials.
  flyway:
    enabled: false
    locations: classpath:db/migration
    clean-disabled: true

balance:
  retry:
    max-attempts: ${BALANCE_RETRY_MAX_ATTEMPTS:3}
    budget-millis: ${BALANCE_RETRY_BUDGET_MILLIS:20000}
    backoff-millis: ${BALANCE_RETRY_BACKOFF_MILLIS:50}
  execution:
    enabled: ${EXECUTION_POLICY_ENABLED:false}
    funding:
      IRR:
        account-id: ${EXECUTION_IRR_FUNDING_ACCOUNT_ID:}
        policy-version: ${EXECUTION_IRR_FUNDING_POLICY_VERSION:}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    stage: bootstrap
